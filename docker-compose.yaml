services:
  app:
    image: node:20-alpine
    container_name: order-api
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://root:example@mongo:27017/order-db?authSource=admin
      - JWT_SECRET=wzzxxcvswjlasev
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm run dev"
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo
    container_name: order-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    container_name: order-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - mongo

volumes:
  mongo-data: